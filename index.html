<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Notes</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    h1 { font-size: 1.2rem; margin-bottom: 12px; color: var(--accent-color); }
    .config-panel {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    input, button, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #090d16;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      overflow: hidden;
    }
    #output {
      flex: 1;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border-color);
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.9rem;
    }
    #input-area {
      display: flex;
      gap: 8px;
    }
    #user-input { flex: 1; height: 60px; resize: none; }
    #send-btn { width: 80px; height: 60px; margin-top: 0; }
  </style>
</head>
<body>

  <h1>🤖 My AI Notes (Drive Synced)</h1>

  <!-- 設定エリア -->
  <div class="config-panel" id="config-panel">
    <div><strong>設定 (ローカル保存)</strong></div>
    <input type="text" id="client-id" placeholder="Google OAuth Client ID">
    <input type="password" id="gemini-key" placeholder="Gemini API Key">
    <button onclick="saveConfig()">設定を保存して認証</button>
  </div>

  <!-- メインエリア -->
  <div class="main-container">
    <div id="output">設定を入力して保存ボタンを押してください。</div>
    <div id="input-area">
      <textarea id="user-input" placeholder="メモを入力、またはAIに相談..."></textarea>
      <button id="send-btn" onclick="handleSend()">送信</button>
    </div>
  </div>

  <script>
    // 初期ロード処理
    window.onload = () => {
      document.getElementById('client-id').value = localStorage.getItem('oauth_client_id') || '';
      document.getElementById('gemini-key').value = localStorage.getItem('gemini_api_key') || '';
      if(localStorage.getItem('oauth_client_id') && localStorage.getItem('gemini_api_key')) {
        document.getElementById('output').innerText = "準備完了！メモを入力するか、AIに話しかけてみてください。";
      }
    };

    function saveConfig() {
      const clientId = document.getElementById('client-id').value.trim();
      const geminiKey = document.getElementById('gemini-key').value.trim();
      
      if(!clientId || !geminiKey) {
        alert("両方のキーを入力してください");
        return;
      }

      localStorage.setItem('oauth_client_id', clientId);
      localStorage.setItem('gemini_api_key', geminiKey);
      alert("設定をブラウザに保存しました！");
      document.getElementById('output').innerText = "設定が保存されました。";
    }

    async function handleSend() {
      const input = document.getElementById('user-input').value.trim();
      const geminiKey = localStorage.getItem('gemini_api_key');
      const output = document.getElementById('output');

      if (!input) return;
      if (!geminiKey) {
        alert("Gemini APIキーを設定してください");
        return;
      }

      output.innerText += `\n\nあなた: ${input}\nAI思考中...`;
      document.getElementById('user-input').value = '';

      try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                  
                })
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `以下の入力内容を整理・応答してください：\n${input}` }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          output.innerText += `\nAPIエラー: ${data.error.message}`;
          output.scrollTop = output.scrollHeight;
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "応答を取得できませんでした。";
        
        output.innerText += `\nAI: ${reply}`;
        output.scrollTop = output.scrollHeight;
      } catch (err) {
        output.innerText += `\n通信エラーが発生しました: ${err.message}`;
      }
    }
  </script>
</body>
</html>
